<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mesa de Ayuda - Concentrix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="/static/icono.jpg">
</head>
<body class="bg-light">

    <!-- Barra de navegación unificada -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="/static/logo.jpg" alt="Concentrix" style="height: 32px;" class="me-2">
                <span style="font-size: 1rem; font-weight: 300; opacity: 0.8; color: #fff;">| Soporte IA</span>
            </a>

            <div class="d-flex text-white align-items-center">
                <span class="me-3">Hola, <strong>{{ nombre }}</strong> ({{ rol }})</span>
                
                {% if rol == 'Analista' %}
                    <a href="/historial" class="btn btn-outline-light btn-sm me-2">Ir a Historial</a>
                {% elif rol == 'Administrador' %}
                    <a href="/historial" class="btn btn-outline-light btn-sm me-2">Historial</a>
                    <a href="/reportes" class="btn btn-outline-light btn-sm me-2">Reportes</a>
                    <a href="/crear-usuario" class="btn btn-success btn-sm me-2">Crear Usuario</a>
                {% endif %}

                <a href="/logout" class="btn btn-danger btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="text-center mb-4">Registro Inteligente de Incidencias</h2>
        
        {% if mensaje %}
            {{ mensaje | safe }}
        {% endif %}

        <div class="card shadow p-4">
            <form method="POST" action="/">
                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción del Problema Técnico (Cliente):</label>
                    <textarea class="form-control" id="descripcion" name="descripcion" rows="4" required placeholder="Ej. La computadora no enciende y se escucha un pitido de falla de hardware..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Registrar y Analizar con IA</button>
            </form>
        </div>
    </div>
</body>
</html>
